<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" role="img" aria-label="Kamikin">
  <title>Kamikin</title>
  <style>
    .ink { fill: #1f2a1c; }
    .acc { fill: #4a5f3c; }
    .eye { fill: #f0efe7; }
  </style>
  <!-- mochi mark: two ears on a soft bun with a face -->
  <ellipse class="acc" cx="15" cy="12" rx="6" ry="9" transform="rotate(-14 15 12)"/>
  <ellipse class="acc" cx="35" cy="12" rx="6" ry="9" transform="rotate(14 35 12)"/>
  <rect class="ink" x="4" y="14" width="42" height="36" rx="18"/>
  <ellipse class="eye" cx="19" cy="31" rx="3" ry="4.5"/>
  <ellipse class="eye" cx="31" cy="31" rx="3" ry="4.5"/>
  <text class="ink" x="58" y="41" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Kamikin<tspan class="acc">.</tspan></text>
</svg>
